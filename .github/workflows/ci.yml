name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Built-in credential scan
        run: safeops --root . scan
      - name: Verify buildable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

  quality-gate:
    name: quality-gate
    needs: [tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require entire cross-platform test matrix
        env:
          MATRIX_RESULT: ${{ needs.tests.result }}
        run: test "$MATRIX_RESULT" = "success"
