[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "euromind-safeops"
version = "0.3.0a12"
description = "Provider-agnostic, safety-focused AI engineering orchestration CLI"
readme = "docs/PACKAGE.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Sérgio Ribeiro"}]
keywords = ["ai", "devops", "orchestration", "security", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
safeops = "euromind_safeops.cli:main"

[project.urls]
Homepage = "https://github.com/herculespt/euromind-safeops"
Repository = "https://github.com/herculespt/euromind-safeops"
Issues = "https://github.com/herculespt/euromind-safeops/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
euromind_safeops = ["py.typed"]

[tool.coverage.run]
branch = true
source_pkgs = ["euromind_safeops"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
fail_under = 90
precision = 2
ignore_errors = false
